version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # The Node types follow the Node line in package.json engines, like the image below.
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    # The image follows the Node line in package.json engines; a major moves both by hand.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
