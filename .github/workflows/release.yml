name: Release

# Pushing a version tag (v0.2.0, v0.3.0-rc.1...) runs the whole test suite, then pushes the image to Docker Hub (xiaodoudoufr/homelabdash,
# with the DOCKERHUB_TOKEN repository secret), then creates the GitHub release. A step that fails stops the ones after it: nothing is published from a red build.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # a tag that does not name the version of package.json, that is not on the main branch, or whose version has no section in
  # CHANGELOG.md, is not a release
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not name the version of package.json ($version)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tag $GITHUB_REF_NAME is not on the main branch"
            exit 1
          fi
          if ! node scripts/release-notes.js "$version" > /dev/null; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

  # the same jobs as on every push (commits, lint, types, privacy, tests, secrets scan, image smoke test)
  test:
    needs: check
    uses: ./.github/workflows/test.yml

  image:
    needs: [check, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: xiaodoudoufr
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # a prerelease gets its own tag only, so that :latest and :0.2 keep pointing at the last stable version
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: xiaodoudoufr/homelabdash
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.check.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.check.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: [check, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # the notes are the version's section of CHANGELOG.md, followed by the notes GitHub generates (pull requests, compare link)
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          {
            echo "Run it with \`docker pull xiaodoudoufr/homelabdash:$VERSION\`."
            echo
            node scripts/release-notes.js "$VERSION" "https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "homelabdash $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes $flags
